[workspace]
resolver = "3"
members = [
    "crates/wallet-core",
    "crates/app",
    "crates/desktop",
    "crates/mobile",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The executable is distributed under the wallet's licence (docs/PLAN.md
# section 6): the Mochimo Cryptocurrency Engine License Agreement, version
# 1.0. `LICENSE.md` is Rep-1's file copied byte for byte. The agreement has no
# SPDX identifier, which is why this is `license-file` and not `license`, and
# why deny.toml has to say how to read it.
license-file = "LICENSE.md"
# Nothing here is published to a registry. The application ships as signed
# packages (docs/PLAN.md section 6), never as crates.
publish = false
repository = "https://github.com/patricksmithlaravel/Tawara-wallet"

[workspace.dependencies]
# THE WALLET LIBRARY, PINNED BY FULL COMMIT HASH (docs/PLAN.md D1).
#
# Rep-1 (`patricksmithlaravel/mcm-rust-cli-windows`) at `main`, 8c2f39a: the
# merge that brought down Rep-0's cancellation and progress for the long
# operations, `Wallet::open_or_return`, the planned-spend page and the
# command line's decisions made public (docs/DECISIONS.md D7, D23), in the
# form docs/PLAN.md D1 gives. Upgrading the
# library is a change to `rev` and to nothing else: no `[patch]`, no vendored
# copy, no fork. A change the application needs from the library is made in
# Rep-0, merged down into Rep-1, and picked up here by moving `rev`.
# `crates/wallet-core/tests/policy.rs` holds this line to a 40-hex `rev`
# alone and the repository to no patch, replacement or path override, and
# deny.toml refuses `raw-backend` in the resolved graph.
#
# `default-features = false` with `native` named, and `mesh-https` for TLS:
# rustls with `ring`, the one dependency that compiles C (D4). This
# workspace never turns on `raw-backend`: it is the library's test-only
# feature, and with it off the only path to a signature is
# `Keystore::sign_spend` behind an `AdvanceReceipt` (the library's I1).
mochimo-crypto = { git = "https://github.com/patricksmithlaravel/mcm-rust-cli-windows", rev = "8c2f39a2cdc2710ac7363b1d64026b6875a16537", default-features = false, features = ["native", "mesh-https"] }

# THE TOOLKIT (docs/PLAN.md D2): iced, at its latest release when the work
# began. Recorded in docs/DECISIONS.md (D6). `=0.14.0` fixes the `iced` crate
# itself; its subcrates (iced_core, iced_widget, iced_winit, iced_renderer,
# iced_wgpu, iced_tiny_skia and the rest) are required by it at `^0.14.0`, so
# the committed Cargo.lock is what holds them, and CI builds with `--locked`.
# A `cargo update` can move them within 0.14.x; that is a deliberate change,
# reviewed with `cargo deny check` like any other.
#
# The features are iced 0.14.0's own defaults, written out so that what
# ships is a list in this file rather than whatever iced's default becomes:
# `wgpu` and `tiny-skia` (the pure-Rust software renderer, D2), `crisp`,
# `web-colors`, `thread-pool`, and on Linux `x11`, `wayland` and
# `linux-theme-detection`. Two are added for phase 3 (docs/DECISIONS.md
# D27): `canvas`, which draws the line icons from the renderings' path data
# (six crates, `lyon` and its parts, where `svg` would add 35), and
# `advanced`, which adds no crate and opens the renderer's headless
# screenshot (`Headless`) to the screenshot example. `qr_code` comes only
# with the owner's approval, with deny.toml run against the result.
iced = { version = "=0.14.0", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "canvas",
    "advanced",
    "crisp",
    "web-colors",
    "thread-pool",
    "linux-theme-detection",
    "x11",
    "wayland",
] }

# The screenshot example only (docs/DECISIONS.md D27, item 1), as
# dev-dependencies of `tawara-app`; neither reaches a shipped build.
# `iced_runtime` is iced's own (already in every build at this version, and
# held there by the lockfile) and gives the example `UserInterface`, which
# iced does not re-export; `png` writes and reads the images.
iced_runtime = "0.14.0"
png = "0.18"

tawara-wallet-core = { path = "crates/wallet-core" }
tawara-app = { path = "crates/app" }

# wallet-core's two direct dependencies beside the library (docs/DECISIONS.md
# D20). Both were already in its graph through the library, at these
# versions, so naming them adds no crate to any build.
#
# `zeroize`: the library's own scrubbing crate, for the buffers that hold a
# password or a recovery phrase on their way to the library (docs/PLAN.md
# section 4.2). Default features (`alloc`), which the library's line already
# turns on.
zeroize = "1.9.0"
# `getrandom` 0.2: the operating system's generator, for the three draws
# creating a store takes and the one opening it takes (docs/PLAN.md section
# 4.4). The 0.2 line is `ring`'s, so it is compiled into every build that
# has TLS, on every platform; on Windows it is `BCryptGenRandom` with the
# system-preferred generator, the call the command-line wallet makes.
getrandom = "0.2.17"
# The fake node in wallet-core's tests reads the JSON the library's codec
# writes. A dev-dependency only, already in the graph through the library.
serde_json = "1.0.151"

# Dev-dependencies of the policy checks only (crates/wallet-core/tests/
# policy.rs). They never reach a shipped build.
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing", "visit", "visit-mut", "clone-impls"] }
proc-macro2 = { version = "1", default-features = false }
quote = { version = "1", default-features = false }
toml = "0.9"

# THE RELEASE PROFILE IS A SECURITY PROPERTY OF THE LIBRARY, AND PROFILES ARE
# ONLY READ FROM THE ROOT OF THE WORKSPACE BEING BUILT. Rep-1's own
# `[profile.release]` therefore does not reach a build of this repository:
# it has to be restated here or it is silently lost.
#
# `panic = "unwind"`: every scrub of key material in mochimo-crypto runs
# through `Drop` (`zeroize`, `Zeroizing`, `Secret`). Under `panic = "abort"`
# destructors do not run, so the master seed would stay in memory on exactly
# the path where it matters most, and SIGABRT's default disposition writes a
# core file. Rep-1's Cargo.toml measures this; a smaller binary is not worth
# the seed.
#
# `overflow-checks = true`: cargo turns them off in release by default, so a
# bare `+` on a balance would wrap silently in the build users run while
# panicking in the debug build every test runs in.
#
# `crates/wallet-core/tests/policy.rs` fails if either line changes.
[profile.release]
panic = "unwind"
overflow-checks = true

# The key derivation, optimised in test and debug builds only. Every store
# the worker's tests create or open pays Argon2id at `Kdf::RECOMMENDED` (the
# library hard-codes it for `create`, and the store's header carries it), and
# unoptimised that is about three seconds where a release build takes a
# tenth. With these two crates optimised it is about one. Nothing about the
# derivation's result or its checks changes, and the release profile above is
# untouched.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
