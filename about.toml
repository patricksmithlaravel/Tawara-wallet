# THE COPYRIGHT HOLDERS (docs/DECISIONS.md D35, item 6 (a)). The MIT, ISC and
# BSD licences ask for the copyright notice to go with the software, so each
# crate under one of them is given the text that names its holder, wherever the
# crate publishes one. cargo-about reads a package's licence files only under
# the names it recognises. Where it finds none, it prints the licence's standard
# text, whose copyright line is a template ("<year> <copyright holders>") and
# names nobody. The entries below give it the crate's own text instead:
#
# - `files`: a file the package carries under a name cargo-about does not read,
#   or a different file from the one it would pick;
# - `git`: a file in the crate's repository at the commit the package was
#   published from, which cargo-about reads from the package's
#   `.cargo_vcs_info.json` and fetches from raw.githubusercontent.com on every
#   run. The generator needs the network for these. A failed fetch only warns,
#   and the byte comparison in `ci/notices.sh --check` then fails.
#
# Every file is pinned by the SHA-256 of its text. A name covers every version
# of the crate in the graph, and a clarification that fails for one version
# leaves that version to the files in its package, with a warning.
#
# What is left. Some crates publish their licence with no copyright line, in
# the package and in the repository alike (most of dtolnay's, serde's and
# smol-rs's crates, among others); their text is printed as published. Fifteen
# crate versions, all from SSheldon's and madsmtm's Objective-C crates, publish
# no text of their licence anywhere; they get the standard text, from which
# ci/notices.sh removes the template line (D35 item 2), and
# crates/wallet-core/tests/policy.rs lists them. The template names the authors
# from each crate's metadata beside every crate, and says that they are not
# necessarily the holders.

# Microsoft's windows crates carry their texts as `license-mit` and
# `license-apache-2.0`, which cargo-about does not read. The MIT one names
# Microsoft Corporation. Every version in the graph has the same two files.

