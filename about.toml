# cargo-about's configuration for THIRD-PARTY-NOTICES.txt (docs/DECISIONS.md
# D35). ci/notices.sh reads it. The notices are the licence texts of the crates
# this desktop application is built from, taken from Cargo.lock, so the file
# records what the program contains rather than what someone remembers adding.
#
# WHAT IS COUNTED. The crates that the targets below reach, with every feature
# switched on, as deny.toml's `[graph]` table does: a feature added later cannot
# hide a crate from the notices. Build dependencies are kept, because a build
# script's output can end up in the executable. Development-only crates are
# left out, because a shipped binary does not contain them. The mobile targets
# are not listed: the phone wallet is noticed in its own repository
# (docs/DECISIONS.md D33).
#
# WHICH TARGETS. Both processors on each desktop system: x86_64 and aarch64 for
# Windows (MSVC), Linux (GNU) and macOS. Which of them the packages cover is a
# phase 5 decision (docs/PLAN.md section 7). A crate that one of these targets
# builds, and this file omits, would ship without its licence text, and no check
# would notice; so the file names every desktop target.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
ignore-build-dependencies = false
ignore-dev-dependencies = true
ignore-transitive-dependencies = false

# THE ACCEPTED LICENCES are deny.toml's allow list, the same ten identifiers
# (docs/DECISIONS.md D10 and D12). A crate under any other licence is an error.
# Two exceptions are made below, each for named crates only: the Mochimo
# agreement for Tawara's crates and the library, and OFL-1.1 for tawara-app's
# fonts (D35 items 3 and 6 (d)). crates/wallet-core/tests/policy.rs holds this
# list to deny.toml's and the exceptions to that table, so neither can widen
# without a change to the test.
# So is a crate whose licence cannot be worked out at all: ci/notices.sh runs
# the generator with `--fail`, which makes that an error rather than a crate
# left out in silence. A clarification whose file cannot be read, or whose
# checksum does not match, is only a warning, and the run still exits 0. The
# byte comparison in `ci/notices.sh --check` is what catches a change it causes.
accepted = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSD-2-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "Zlib",
]

# chrono keeps its MIT and Apache-2.0 texts in one file. The generator's
# `chrono` workaround splits that file, so that each licence has its own text.
workarounds = ["chrono"]

# There is deliberately no `[private]` table. Its `ignore = true` drops every
# crate whose package is not published, and this repository's crates and the
# library are not published (`publish = false`). That would leave their
# licences out without anyone reading them (docs/DECISIONS.md D10). Each of
# them is named below instead, with the licence it is held to.

# THE MOCHIMO AGREEMENT has no SPDX identifier. The crates that carry it name it
# `LicenseRef-Mochimo-Engine-1.0`, as deny.toml does (docs/DECISIONS.md D10).
# cargo-about 0.9.2 does not print the text of a `LicenseRef-` licence, so
# ci/notices.sh appends LICENSE.md to the generated file itself. The three
# warnings the generator prints about these crates are expected. Each crate
# below accepts the identifier alone, and its clarification pins LICENSE.md by
# SHA-256.

[mochimo-crypto]
accepted = ["LicenseRef-Mochimo-Engine-1.0"]

[mochimo-crypto.clarify]
license = "LicenseRef-Mochimo-Engine-1.0"

