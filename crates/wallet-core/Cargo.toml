[package]
name = "tawara-wallet-core"
description = "Everything in Tawara that touches the wallet library: the worker, its commands and events, lifecycle, secrets and store policy. No interface dependency."
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true

# NO INTERFACE DEPENDENCY, ever (docs/PLAN.md section 3 and D3). This crate
# is what survives if the mobile shells are replaced, so nothing in it may
# name iced or any other toolkit. `tests/policy.rs` checks the manifest.

[dependencies]
mochimo-crypto.workspace = true
zeroize.workspace = true
getrandom.workspace = true

[dev-dependencies]
serde_json.workspace = true
syn.workspace = true
proc-macro2.workspace = true
quote.workspace = true
toml.workspace = true
