# Continuous integration on the three desktop operating systems.
#
# docs/PLAN.md phase 0 is done when the workspace builds and is clean under
# clippy on Windows, macOS and Linux in CI, and `cargo deny` is green. This
# workflow runs those checks, and the tests, docs and formatting, on every
# push to main and every pull request.
#
# NO ACTIONS, after Rep-1's board workflow. Every step is a command against
# tools the runner image already carries: git, rustup, and a C compiler for
# `ring`. On Linux the image's apt-get also installs the display and Vulkan
# packages the desktop check needs (docs/DECISIONS.md D32 item 9). A `uses:`
# line is another repository's code run inside this job, and nothing this job
# needs is something `git`, `rustup` or `apt-get` does not supply.
# The cost is stated rather than hidden: no dependency cache, so every run
# builds cold; and no uploaded artifact, because the runner gives the upload
# token only to actions and not to `run:` steps, so a run's only output is its
# job log. docs/PLAN.md section 5 asks for phase 3's screenshots to be kept;
# they are committed in design/screenshots/ instead of uploaded, and the
# Linux job checks that they are what the screens draw (docs/DECISIONS.md
# D13, D27 item 1).
#
# WHAT A GREEN RUN SAYS. That this commit builds, lints clean, passes its
# tests (including the policy checks in crates/wallet-core/tests/policy.rs)
# and documents without warnings on the three hosts, with the compiler
# rust-toolchain.toml pins; that the committed screenshots are pixel for
# pixel what the screens draw on Linux; that cargo-deny found nothing against
# deny.toml on the day it ran; and that on Linux the desktop app starts under
# Xvfb, on wgpu and on tiny-skia, and is still running after a fixed wait with
# no panic in its log (docs/DECISIONS.md D32 item 9). It says nothing about
# Android or iOS, which phase 1's spike measures.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Each job reads a public repository and writes nothing, so the token is given
# no permission at all. The clone below is anonymous.
permissions: {}

# A newer push to the same branch or pull request supersedes a run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check, ${{ matrix.os }}
    strategy:
      # A red platform does not cancel the other two: they are what a reader
      # compares it with.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A cold build of iced, wgpu and the library, and cargo-deny built from
    # source, on the slowest of the three.
    timeout-minutes: 90
    defaults:
      run:
        # `bash --noprofile --norc -e -o pipefail`; on Windows, Git Bash.
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Clone the commit under the user's profile
        # Under the profile rather than the runner's workspace, as Rep-1's
        # board does: on Windows a directory outside the profile can inherit
        # an access list that grants other users, which the library's
        # access-list check refuses once tests open stores (phase 2). On
        # Windows the profile is read from USERPROFILE.
        #
        # `GITHUB_SHA` is fetched by id. A pull request's commit is a merge
        # commit that no branch reaches, and the merge ref that named it moves
        # when the base moves, while a re-run keeps the original SHA; fetching
        # the ref by name would then bring a different commit.
        run: |
          base=$HOME
          if [ -n "${USERPROFILE:-}" ]; then base=$(cygpath -u "$USERPROFILE"); fi
          git clone --quiet --no-checkout "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$base/tawara"
          git -C "$base/tawara" fetch --quiet origin "$GITHUB_SHA"
          git -C "$base/tawara" checkout --quiet --detach "$GITHUB_SHA"
          echo "TAWARA=$base/tawara" >> "$GITHUB_ENV"

      - name: Refuse a checkout that is not the commit's bytes
        # `.gitattributes` asks for LF on every text file, and the policy
        # tests read manifests and sources as bytes. A file git reports as
        # CRLF in the working tree is a tree that is not the commit.
        run: |
          cd "$TAWARA"
          eol=$(git ls-files --eol)
          if printf '%s\n' "$eol" | grep 'w/crlf'; then
            echo "The files above were checked out with CRLF line endings." >&2
            exit 1
          fi

      - name: Name the commit, the host and the toolchain
        # Its outcome gates every step after the build: it succeeds only when
        # the clone, the line-ending refusal and the toolchain install did.
        id: toolchain
        # `rustup toolchain install` with no argument installs what
        # rust-toolchain.toml pins, and the versions printed show which
        # compiler ran. `--no-self-update` leaves the image's rustup alone.
        run: |
          cd "$TAWARA"
          rustup toolchain install --no-self-update
          echo "commit  $(git rev-parse HEAD)"
          echo "date    $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "image   ${ImageOS:-unnamed} ${ImageVersion:-unversioned}"
          echo "host    $(uname -srm)"
          rustc -vV
          cargo -V

      - name: cargo build --workspace
        # `--locked` on every command that resolves the dependency graph: the
        # committed Cargo.lock is used exactly, and a run that would have to
        # change it fails instead. (`cargo fmt` reads no lockfile.)
        # Its outcome gates the desktop check below, which runs the binary this
        # step builds.
        id: build
        run: |
          cd "$TAWARA"
          cargo build --workspace --locked

      - name: Xvfb, Vulkan and the X11 libraries (Linux)
        # docs/DECISIONS.md D32 item 9: the desktop check in the next step needs
        # an X server, which is Xvfb, and xauth, which xvfb-run needs to start
        # it. mesa-vulkan-drivers is Mesa's software Vulkan driver, lavapipe,
        # which wgpu runs on here. libvulkan1 is the Vulkan loader wgpu opens;
        # it is named because --no-install-recommends skips recommended
        # packages. The X11 libraries are the ones winit opens at run time, and
        # the spike's desktop job installs these on the same image. The step is
        # plain apt, with no action, as D13 asks.
        id: packages
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Linux' }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends xvfb xauth mesa-vulkan-drivers libvulkan1 \
            libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6 libx11-xcb1

      - name: the desktop app starts under Xvfb, on wgpu and on tiny-skia (Linux)
        # docs/DECISIONS.md D32 item 9. Nothing else in CI starts tawara-desktop,
        # so a panic at start-up would pass without this. ci/liveness.sh runs
        # the binary this job built once per renderer, for a fixed wait, and
        # fails if the app exits, cannot be found among the launch's processes,
        # or its log holds a panic. With HOME and the XDG folders fresh there is
        # no node to contact, so the check needs no network. This step runs only
        # where the packages step did, which is on Linux after a good build.
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        run: |
          cd "$TAWARA"
          bash ci/liveness.sh "$TAWARA/target/debug/tawara-desktop"

      - name: cargo clippy --workspace --all-targets --locked -- -D warnings
        # After a failed build the remaining checks still run, so one red
        # step does not hide another; after a failed clone, refusal or
        # toolchain install, nothing runs.
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          cd "$TAWARA"
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test --workspace
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          cd "$TAWARA"
          cargo test --workspace --locked

      - name: the screenshots are what the screens draw (Linux)
        # docs/DECISIONS.md D27, item 1. Every built screen is drawn headlessly
        # with iced's software renderer from sample data and compared pixel
        # for pixel with design/screenshots/. On Linux only: the images were
        # drawn there, and the renderer's floating-point and SIMD paths may
        # round differently on another processor (the macOS runner is ARM).
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && runner.os == 'Linux' }}
        run: |
          cd "$TAWARA"
          cargo run -p tawara-app --example screenshots --locked -- --check

      - name: cargo doc --workspace --no-deps
        # Zero warnings, as in Rep-1: a broken intra-doc link is a defect.
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cd "$TAWARA"
          cargo doc --workspace --no-deps --locked

      - name: cargo fmt --all --check
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          cd "$TAWARA"
          cargo fmt --all --check

      - name: cargo deny --locked check
        # cargo-deny is built from crates.io at a pinned version with its own
        # lockfile, rather than downloaded as a prebuilt binary or run through
        # an action. Its verdict does not depend on the host, and it runs on
        # all three so each platform's run is complete on its own.
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          cd "$TAWARA"
          cargo install --quiet --locked cargo-deny --version 0.20.2
          cargo deny --version
          cargo deny --locked check
